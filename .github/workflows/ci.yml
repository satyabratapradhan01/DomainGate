name: DomainGate CI

on:
  push:
    branches: [ origin, main, master ]
  pull_request:
    branches: [ origin, main, master ]

jobs:
  validate:
    name: Typecheck, Diagnostics & Web Bundling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Expo Doctor Health Check
        run: npx expo-doctor

      - name: Build Web Production Bundle
        run: npx expo export --platform web

